name: Release macOS

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_INPUT_TAG: ${{ inputs.tag }}
  WORKFLOW_EVENT_NAME: ${{ github.event_name }}

jobs:
  quality:
    name: Quality Gate
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Full test suite
        shell: bash
        run: |
          set -euo pipefail
          swift test

      - name: Migration parser pricing regression tests
        shell: bash
        run: |
          set -euo pipefail
          swift test --filter 'StorageResilienceTests|ParserRecoveryTests|PricingTruthTests|ImporterRecoveryTests|CodexRolloutScannerTests'

      - name: Release build
        shell: bash
        run: |
          set -euo pipefail
          swift build -c release

      - name: Git whitespace check
        shell: bash
        run: |
          set -euo pipefail
          previous_tag="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [[ -n "${previous_tag}" ]]; then
            git diff --check "${previous_tag}" HEAD
          else
            empty_tree="$(git hash-object -t tree /dev/null)"
            git diff --check "${empty_tree}" HEAD
          fi

  build:
    name: Build ${{ matrix.label }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: apple-silicon
            label: Apple Silicon
            runner: macos-15
          - arch: intel
            label: Intel
            runner: macos-15-intel
          - arch: universal
            label: Universal
            runner: macos-15
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "${WORKFLOW_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${RELEASE_INPUT_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${tag}"
            exit 1
          fi
          tag_commit="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
          if [[ "${tag_commit}" != "$(git rev-parse HEAD)" ]]; then
            echo "Checked-out commit does not match tag ${tag}."
            exit 1
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid VERSION: ${version}"
            exit 1
          fi

          if [[ "${tag}" != "v${version}" ]]; then
            echo "Tag ${tag} does not match VERSION ${version}. Expected v${version}."
            exit 1
          fi

          echo "APP_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "RELEASE_TAG=${tag}" >> "${GITHUB_ENV}"

      - name: Build package
        shell: bash
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLE_PUBLIC_ED_KEY:-}" ]]; then
            echo "Official releases require the Sparkle public key."
            exit 1
          fi

          ./scripts/build_and_package.sh \
            --arch "${{ matrix.arch }}" \
            --version "${APP_VERSION}" \
            --build-number "${GITHUB_RUN_NUMBER}" \
            --signing-mode adhoc

      - name: Launch packaged app smoke test
        shell: bash
        run: |
          set -euo pipefail
          executable="dist/QuotaLens.app/Contents/MacOS/QuotaLens"
          smoke_log="${RUNNER_TEMP}/quotalens-smoke.log"
          "${executable}" >"${smoke_log}" 2>&1 &
          app_pid=$!
          sleep 5
          if ! kill -0 "${app_pid}" 2>/dev/null; then
            cat "${smoke_log}"
            echo "Packaged app exited during startup."
            exit 1
          fi
          kill "${app_pid}"
          wait "${app_pid}" 2>/dev/null || true

      - name: Generate architecture appcast
        if: matrix.arch != 'universal'
        shell: bash
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLE_PRIVATE_ED_KEY}" ]]; then
            echo "Missing SPARKLE_PRIVATE_ED_KEY repository secret."
            exit 1
          fi
          ./scripts/generate_appcast.sh \
            --arch "${{ matrix.arch }}" \
            --version "${APP_VERSION}" \
            --build-number "${GITHUB_RUN_NUMBER}" \
            --archive "dist/QuotaLens-v${APP_VERSION}-macOS-${{ matrix.arch }}.zip" \
            --output "dist/appcast-${{ matrix.arch }}.xml"

      - name: Collect assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp dist/*.dmg dist/*.zip release-assets/
          if compgen -G "dist/appcast-*.xml" > /dev/null; then
            cp dist/appcast-*.xml release-assets/
          fi
          ls -lh release-assets

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quotalens-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "${WORKFLOW_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${RELEASE_INPUT_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${tag}"
            exit 1
          fi
          tag_commit="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
          if [[ "${tag_commit}" != "$(git rev-parse HEAD)" ]]; then
            echo "Checked-out commit does not match tag ${tag}."
            exit 1
          fi
          if [[ "${tag}" != "v${version}" ]]; then
            echo "Tag ${tag} does not match VERSION ${version}. Expected v${version}."
            exit 1
          fi
          echo "APP_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "RELEASE_TAG=${tag}" >> "${GITHUB_ENV}"

      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Create checksums and release notes
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f release-assets/appcast-apple-silicon.xml && -f release-assets/appcast-intel.xml ]]; then
            {
              printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>'
              printf '%s\n' '<rss version="2.0"'
              printf '%s\n' '     xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle"'
              printf '%s\n' '     xmlns:dc="http://purl.org/dc/elements/1.1/">'
              printf '%s\n' '  <channel>'
              printf '%s\n' '    <title>QuotaLens Updates</title>'
              printf '%s\n' "    <link>https://github.com/${GITHUB_REPOSITORY}</link>"
              printf '%s\n' '    <description>QuotaLens appcast</description>'
              printf '%s\n' '    <language>en</language>'
              for appcast in release-assets/appcast-apple-silicon.xml release-assets/appcast-intel.xml; do
                awk '/<item>/{emit=1} emit{print} /<\/item>/{emit=0}' "${appcast}"
              done
              printf '%s\n' '  </channel>'
              printf '%s\n' '</rss>'
            } > release-assets/appcast.xml
          fi

          (
            cd release-assets
            shasum -a 256 *.dmg *.zip > SHA256SUMS.txt
          )

          source_commit="$(git rev-parse HEAD)"

          cat > release-notes.md <<EOF
          # QuotaLens ${RELEASE_TAG}

          ## Downloads

          - Apple Silicon: for Macs with Apple M-series chips.
          - Intel: for Intel-based Macs.
          - Universal: one app containing both Apple Silicon and Intel binaries.
          - In-app updates: supported in update-capable builds.

          ## Build verification

          - Signing: ad-hoc
          - Notarization: not requested
          - Architectures: Apple Silicon, Intel, and Universal
          - Source commit: ${source_commit}

          Check \`SHA256SUMS.txt\` to verify downloaded files.
          EOF

          ls -lh release-assets

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "QuotaLens ${RELEASE_TAG}" \
            --notes-file release-notes.md
