name: Release macOS

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  quality:
    name: Quality Gate
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Full test suite
        shell: bash
        run: |
          set -euo pipefail
          swift test

      - name: Migration parser pricing regression tests
        shell: bash
        run: |
          set -euo pipefail
          swift test --filter 'StorageResilienceTests|ParserRecoveryTests|PricingTruthTests|ImporterRecoveryTests|CodexRolloutScannerTests'

      - name: Release build
        shell: bash
        run: |
          set -euo pipefail
          swift build -c release

      - name: Git whitespace check
        shell: bash
        run: |
          set -euo pipefail
          previous_tag="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [[ -n "${previous_tag}" ]]; then
            git diff --check "${previous_tag}" HEAD
          else
            empty_tree="$(git hash-object -t tree /dev/null)"
            git diff --check "${empty_tree}" HEAD
          fi

  build:
    name: Build ${{ matrix.label }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: apple-silicon
            label: Apple Silicon
            runner: macos-15
          - arch: intel
            label: Intel
            runner: macos-15-intel
          - arch: universal
            label: Universal
            runner: macos-15
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid VERSION: ${version}"
            exit 1
          fi

          if [[ "${tag}" != "v${version}" ]]; then
            echo "Tag ${tag} does not match VERSION ${version}. Expected v${version}."
            exit 1
          fi

          echo "APP_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "RELEASE_TAG=${tag}" >> "${GITHUB_ENV}"

      - name: Import Developer ID certificate
        shell: bash
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
          BUILD_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_BUILD_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${DEVELOPER_ID_APPLICATION}" ]]; then
            echo "Missing DEVELOPER_ID_APPLICATION repository secret."
            exit 1
          fi
          if [[ -z "${DEVELOPER_ID_CERTIFICATE_BASE64}" || -z "${DEVELOPER_ID_CERTIFICATE_PASSWORD}" ]]; then
            echo "Missing Developer ID certificate secrets."
            exit 1
          fi
          if [[ -z "${BUILD_KEYCHAIN_PASSWORD}" ]]; then
            echo "Missing APPLE_BUILD_KEYCHAIN_PASSWORD repository secret."
            exit 1
          fi

          CERT_PATH="${RUNNER_TEMP}/developer-id.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/quotalens-signing.keychain-db"
          printf '%s' "${DEVELOPER_ID_CERTIFICATE_BASE64}" | base64 -D > "${CERT_PATH}"
          security create-keychain -p "${BUILD_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${BUILD_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERT_PATH}" \
            -P "${DEVELOPER_ID_CERTIFICATE_PASSWORD}" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" $(security list-keychains -d user | sed 's/[ "]//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${BUILD_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security find-identity -v -p codesigning "${KEYCHAIN_PATH}" | grep -F "${DEVELOPER_ID_APPLICATION}"

      - name: Build package
        shell: bash
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLE_PUBLIC_ED_KEY}" ]]; then
            echo "Missing SPARKLE_PUBLIC_ED_KEY repository secret."
            exit 1
          fi
          if [[ -z "${DEVELOPER_ID_APPLICATION}" ]]; then
            echo "Missing DEVELOPER_ID_APPLICATION repository secret."
            exit 1
          fi
          if [[ -z "${APPLE_ID}" || -z "${APPLE_TEAM_ID}" || -z "${APPLE_APP_SPECIFIC_PASSWORD}" ]]; then
            echo "Missing Apple notarization secrets."
            exit 1
          fi
          ./scripts/build_and_package.sh \
            --arch "${{ matrix.arch }}" \
            --version "${APP_VERSION}" \
            --build-number "${GITHUB_RUN_NUMBER}" \
            --signing-mode developer-id \
            --notarize

      - name: Generate architecture appcast
        if: matrix.arch != 'universal'
        shell: bash
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLE_PRIVATE_ED_KEY}" ]]; then
            echo "Missing SPARKLE_PRIVATE_ED_KEY repository secret."
            exit 1
          fi
          ./scripts/generate_appcast.sh \
            --arch "${{ matrix.arch }}" \
            --version "${APP_VERSION}" \
            --build-number "${GITHUB_RUN_NUMBER}" \
            --archive "dist/QuotaLens-v${APP_VERSION}-macOS-${{ matrix.arch }}.zip" \
            --output "dist/appcast-${{ matrix.arch }}.xml"

      - name: Collect assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp dist/*.dmg dist/*.zip release-assets/
          if compgen -G "dist/appcast-*.xml" > /dev/null; then
            cp dist/appcast-*.xml release-assets/
          fi
          ls -lh release-assets

      - name: Upload package artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: quotalens-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ "${tag}" != "v${version}" ]]; then
            echo "Tag ${tag} does not match VERSION ${version}. Expected v${version}."
            exit 1
          fi
          echo "APP_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "RELEASE_TAG=${tag}" >> "${GITHUB_ENV}"

      - name: Download package artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Create checksums and release notes
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f release-assets/appcast-apple-silicon.xml && -f release-assets/appcast-intel.xml ]]; then
            {
              printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>'
              printf '%s\n' '<rss version="2.0"'
              printf '%s\n' '     xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle"'
              printf '%s\n' '     xmlns:dc="http://purl.org/dc/elements/1.1/">'
              printf '%s\n' '  <channel>'
              printf '%s\n' '    <title>QuotaLens Updates</title>'
              printf '%s\n' "    <link>https://github.com/${GITHUB_REPOSITORY}</link>"
              printf '%s\n' '    <description>QuotaLens appcast</description>'
              printf '%s\n' '    <language>en</language>'
              for appcast in release-assets/appcast-apple-silicon.xml release-assets/appcast-intel.xml; do
                awk '/<item>/{emit=1} emit{print} /<\/item>/{emit=0}' "${appcast}"
              done
              printf '%s\n' '  </channel>'
              printf '%s\n' '</rss>'
            } > release-assets/appcast.xml
          fi

          (
            cd release-assets
            shasum -a 256 *.dmg *.zip > SHA256SUMS.txt
          )

          cat > release-notes.md <<EOF
          # QuotaLens ${RELEASE_TAG}

          ## Downloads

          - Apple Silicon: for Macs with Apple M-series chips.
          - Intel: for Intel-based Macs.
          - Universal: one app containing both Apple Silicon and Intel binaries.
          - In-app updates: supported in update-capable builds.

          Check \`SHA256SUMS.txt\` to verify downloaded files.
          EOF

          ls -lh release-assets

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "QuotaLens ${RELEASE_TAG}" \
            --notes-file release-notes.md
