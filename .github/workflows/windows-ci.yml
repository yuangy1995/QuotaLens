name: Windows
on:
  push:
    branches: [main, 'windows/**']
    paths: ['windows/**', 'shared/**', 'VERSION', 'Sources/QuotaLens/Core/**', 'Tests/QuotaLensTests/SharedCapacityContractTests.swift', '.github/workflows/windows-ci.yml']
  pull_request:
    paths: ['windows/**', 'shared/**', 'VERSION', 'Sources/QuotaLens/Core/**', 'Tests/QuotaLensTests/SharedCapacityContractTests.swift', '.github/workflows/windows-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  catalog-parity:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify reference rates against the actual Swift catalogs
        run: python3 windows/scripts/export-price-catalog.py --check
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core contracts and forecast tests
        run: dotnet run --project windows/QuotaLens.Core.Tests -c Release
      - name: Provider and protocol tests
        run: dotnet run --project windows/QuotaLens.Providers.Tests -c Release
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core tests on Windows
        run: dotnet run --project windows/QuotaLens.Core.Tests -c Release
      - name: Provider tests on Windows
        run: dotnet run --project windows/QuotaLens.Providers.Tests -c Release
      - name: Storage security and indexing tests
        run: dotnet run --project windows/QuotaLens.Infrastructure.Tests -c Release
      - name: Native build and isolated UI smoke test
        run: ./windows/scripts/build.ps1
      - name: Native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QuotaLens-Windows-x64
          path: windows/artifacts/*
          if-no-files-found: error
      - name: Native UI validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuotaLens-native-validation
          path: windows/validation/*
          if-no-files-found: ignore
      - name: Source inspection artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quotalens-port-source
          path: |
            Sources
            Tests
            docs
            windows
            shared
            scripts
            Resources
            .github
            .gitignore
            Package.swift
            Package.resolved
            README.md
            README.zh-CN.md
            VERSION
            LICENSE
            CHANGELOG.md
            THIRD_PARTY_NOTICES.md
            !windows/**/bin/**
            !windows/**/obj/**
            !windows/artifacts/**
            !windows/validation/**
          include-hidden-files: true
          retention-days: 2
