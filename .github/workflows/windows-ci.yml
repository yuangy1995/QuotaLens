name: Windows
on:
  push:
    branches: [main, 'windows/**']
    paths: ['windows/**', 'shared/**', 'VERSION', '.github/workflows/windows-ci.yml']
  pull_request:
    paths: ['windows/**', 'shared/**', 'VERSION', '.github/workflows/windows-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core contracts and forecast tests
        run: dotnet run --project windows/QuotaLens.Core.Tests -c Release
      - name: Provider and protocol tests
        run: dotnet run --project windows/QuotaLens.Providers.Tests -c Release
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core tests on Windows
        run: dotnet run --project windows/QuotaLens.Core.Tests -c Release
      - name: Provider tests on Windows
        run: dotnet run --project windows/QuotaLens.Providers.Tests -c Release
      - name: Native build
        if: ${{ hashFiles('windows/QuotaLens.Windows/QuotaLens.Windows.csproj') != '' }}
        run: ./windows/scripts/build.ps1
      - name: Native artifacts
        if: ${{ hashFiles('windows/artifacts/*.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: QuotaLens-Windows-x64
          path: windows/artifacts/*
          if-no-files-found: error
      - name: Source inspection artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quotalens-port-source
          path: |
            Sources
            Tests
            docs
            windows
            shared
            README.md
            README.zh-CN.md
            VERSION
            CHANGELOG.md
            THIRD_PARTY_NOTICES.md
            !windows/**/bin/**
            !windows/**/obj/**
            !windows/artifacts/**
          retention-days: 2
