name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test and Release Build
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Full test suite
        shell: bash
        run: |
          set -euo pipefail
          swift test

      - name: Release build
        shell: bash
        run: |
          set -euo pipefail
          swift build -c release

      - name: Whitespace check
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^ HEAD
