name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-package:
    name: Test and Release Build
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Full test suite
        shell: bash
        run: |
          set -euo pipefail
          swift test

      - name: Ad-hoc Universal package and signature verification
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build_and_package.sh \
            --arch universal \
            --signing-mode adhoc \
            --dist-dir "${RUNNER_TEMP}/quotalens-ci-package"
          package_version="$(tr -d '[:space:]' < VERSION)"
          hdiutil verify "${RUNNER_TEMP}/quotalens-ci-package/QuotaLens-v${package_version}-macOS-universal.dmg"

      - name: Whitespace check
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^ HEAD
